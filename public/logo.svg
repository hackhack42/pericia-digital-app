<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#3a2e1a"/>
      <stop offset="100%" stop-color="#1a1508"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4b87a"/>
      <stop offset="60%" stop-color="#8b6930"/>
      <stop offset="100%" stop-color="#5c4520"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/></filter>
  </defs>
  <!-- fundo lona -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- textura -->
  <rect width="800" height="450" fill="none" stroke="#c9a86a" stroke-width="0.3" opacity="0.08"/>

  <!-- engrenagem grande -->
  <g transform="translate(400,195)" filter="url(#shadow)">
    <circle r="138" fill="none" stroke="#8b6930" stroke-width="22"/>
    <!-- dentes da engrenagem -->
    <g stroke="#7a5c28" stroke-width="10" fill="none">
      <line x1="0" y1="-138" x2="0" y2="-158"/>
      <line x1="69" y1="-120" x2="79" y2="-137"/>
      <line x1="120" y1="-69" x2="137" y2="-79"/>
      <line x1="138" y1="0" x2="158" y2="0"/>
      <line x1="120" y1="69" x2="137" y2="79"/>
      <line x1="69" y1="120" x2="79" y2="137"/>
      <line x1="0" y1="138" x2="0" y2="158"/>
      <line x1="-69" y1="120" x2="-79" y2="137"/>
      <line x1="-120" y1="69" x2="-137" y2="79"/>
      <line x1="-138" y1="0" x2="-158" y2="0"/>
      <line x1="-120" y1="-69" x2="-137" y2="-79"/>
      <line x1="-69" y1="-120" x2="-79" y2="-137"/>
    </g>
    <!-- lente / vidro -->
    <circle r="108" fill="#2a1e0a" stroke="#c9a86a" stroke-width="4"/>
    <circle r="96" fill="#1e160a"/>
    <!-- textura pergaminho -->
    <circle r="90" fill="#c8a96e" opacity="0.18"/>
    <!-- impressão digital (linhas) -->
    <g fill="none" stroke="#8f1f1f" stroke-width="1.8" opacity="0.85">
      <ellipse rx="18" ry="26" cy="5"/>
      <ellipse rx="30" ry="40" cy="5"/>
      <ellipse rx="42" ry="54" cy="5"/>
      <ellipse rx="54" ry="68" cy="5"/>
      <ellipse rx="66" ry="78" cy="5"/>
    </g>
    <!-- escudo -->
    <g transform="translate(0,5)" filter="url(#glow)">
      <path d="M0,-28 L22,-18 L22,4 Q22,22 0,32 Q-22,22 -22,4 L-22,-18 Z" fill="#c9a86a" opacity="0.9"/>
      <path d="M0,-22 L17,-14 L17,4 Q17,18 0,26 Q-17,18 -17,4 L-17,-14 Z" fill="#8f1f1f"/>
      <!-- buraco de fechadura -->
      <circle cx="0" cy="-4" r="5" fill="#c9a86a"/>
      <rect x="-3" y="1" width="6" height="9" rx="1" fill="#c9a86a"/>
    </g>
    <!-- números na borda -->
    <text font-family="monospace" font-size="8" fill="#c9a86a" opacity="0.6" text-anchor="middle" dy="-125">1328902 · 582325</text>
    <text font-family="monospace" font-size="8" fill="#c9a86a" opacity="0.6" text-anchor="middle" dy="137">9J3B14 · C45271</text>
  </g>

  <!-- bastões cruzados -->
  <g filter="url(#shadow)" opacity="0.9">
    <rect x="280" y="290" width="18" height="110" rx="9" fill="#6b4e27" transform="rotate(-35 280 290)"/>
    <rect x="290" y="285" width="30" height="22" rx="4" fill="#8b6930" transform="rotate(-35 280 290)"/>
    <rect x="490" y="290" width="18" height="110" rx="9" fill="#6b4e27" transform="rotate(35 490 290)"/>
    <rect x="480" y="285" width="30" height="22" rx="4" fill="#8b6930" transform="rotate(35 490 290)"/>
  </g>

  <!-- texto PERÍCIA DIGITAL -->
  <g filter="url(#shadow)">
    <text x="400" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="64" font-weight="bold"
      fill="url(#lens)" letter-spacing="6" style="paint-order:stroke" stroke="#3a2e1a" stroke-width="2">PERÍCIA</text>
    <text x="400" y="435" text-anchor="middle" font-family="Georgia,serif" font-size="44" font-weight="bold"
      fill="#c9a86a" opacity="0.9" letter-spacing="14">DIGITAL</text>
  </g>
</svg>